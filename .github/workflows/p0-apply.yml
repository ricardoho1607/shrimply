name: Validate P0 hardening

on:
  push:
    branches:
      - agent/p0-orson-sync-hardening

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-orson-sync-hardening

      - name: Validate backend syntax
        run: node --check functions/index.js

      - name: Validate mobile hooks
        run: |
          npm ci --ignore-scripts
          npx eslint app/hooks/useGemini.ts app/hooks/useFirebaseSync.ts

      - name: Validate web Orson hook
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npx eslint src/hooks/useGemini.ts
          npx tsc --noEmit

      - name: Set up Java 21 for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Firestore rules in emulator
        run: npx firebase-tools emulators:exec --only firestore --project demo-shrimply "echo firestore-rules-ok"
