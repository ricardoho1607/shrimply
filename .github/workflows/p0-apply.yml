name: Apply guarded P0 hardening patch

on:
  push:
    branches:
      - agent/p0-orson-sync-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-orson-sync-hardening
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python3 .github/scripts/apply_p0.py

      - name: Validate backend syntax and patch whitespace
        run: |
          node --check functions/index.js
          git diff --check

      - name: Validate targeted mobile lint
        run: |
          npm ci --ignore-scripts
          npx eslint app/hooks/useGemini.ts app/hooks/useFirebaseSync.ts

      - name: Commit source changes
        run: |
          git config user.name "Shrimply P0 Fix Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/index.js firestore.rules app/hooks/useGemini.ts app/hooks/useFirebaseSync.ts web/src/hooks/useGemini.ts
          git commit -m "harden Orson quota and Firebase listener cleanup"
          git push origin HEAD:agent/p0-orson-sync-hardening
